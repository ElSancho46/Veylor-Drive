<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Veylor Drive">
<meta name="theme-color" content="#0A0A0A">
<script>
(function(){function setH(){var st=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
 var h=window.innerHeight;
 document.documentElement.style.setProperty('--appH',h+'px')}
 setH();window.addEventListener('resize',setH);window.addEventListener('orientationchange',function(){setTimeout(setH,300)})})();
</script>
<link rel="apple-touch-icon" href="icon.PNG">
<link rel="icon" type="image/png" href="icon.PNG">
<title>Veylor Drive</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap">
<style>
/* Layout : noir et blanc façon catalogue automobile. Grand titre étiré, silhouettes de voitures dessinées, cartes noires sur fond noir, barre d'onglets en bas */
:root{
  --bg:#0A0A0A; --surface:#141414; --surface2:#1D1D1D; --line:#2B2B2B; --fg:#F4F4F2; --muted:#8E8E8B; --dim:#555553;
  --danger:#E5484D;
  --plate-bg:#F4F4F2; --plate-ink:#0A0A0A;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;bottom:auto;height:calc(var(--appH,100vh) - env(safe-area-inset-top,0px));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:env(safe-area-inset-bottom,0px)}
.top{top:0!important}
.grid2>*{min-width:0}
.addr{position:relative}
.gearwrap{position:absolute;top:12px;right:max(16px,env(safe-area-inset-right,0px));z-index:4}
.gear{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(10,10,10,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:7px 9px;color:var(--fg);font-size:.62rem;font-weight:700}
.gear svg{width:20px;height:20px}
.gear.on{background:var(--fg);color:var(--bg)}
.mini .gear{margin-top:4px}
.linkbtn{background:none;border:0;padding:0;color:var(--fg);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.calc{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:.9rem}
.calcrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.calcrow b{display:block;font-size:1.1rem}
.calcrow .btn{margin-left:auto}
.search input{border-radius:999px;padding-left:16px}
.crow{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;text-align:left;width:100%;color:var(--fg)}
.cav{width:42px;height:42px;border-radius:50%;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem}
.cmain{min-width:0;display:flex;flex-direction:column}
.cmain b,.cmain small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmain small,.cside small{color:var(--muted);font-size:.8rem}
.cside{display:flex;flex-direction:column;align-items:flex-end}
.pdays{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.pday{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pday.today{border-color:var(--fg)}
.pday.past{opacity:.6}
.phead{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 14px;font-size:.92rem}
.phead>span:first-child{flex:1}
.tag-today{background:var(--fg);color:var(--bg);font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 8px}
.padd{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--fg);font-size:1.1rem;font-weight:700;line-height:1}
.pfree{padding:0 14px 12px;color:var(--dim);font-size:.85rem}
.prow{display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 12px 10px 14px;color:var(--fg)}
.list .prow{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.prow.clash{background:rgba(229,72,77,.12)}
.ptime{font-weight:600;font-size:.9rem}
.pmain{min-width:0;display:flex;flex-direction:column}
.pmain b,.pmain small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmain small{color:var(--muted);font-size:.8rem}
.pmain small.warn{color:var(--danger);font-weight:700}
.pside{display:flex;align-items:center;gap:6px}
.pside .who{width:24px;height:24px;border-radius:50%;border:1px solid var(--fg);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:var(--fg)}
.tab span{font-size:.62rem}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.sugg button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 13px;font-weight:600;font-size:.95rem;color:var(--fg)}
.sugg button:last-child{border-bottom:0}
.sugg button small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;margin-top:2px}
.sugg .none{padding:11px 13px;color:var(--muted);font-weight:400;font-size:.88rem}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;min-height:46px;text-align:left}
input::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.6}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;font-stretch:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.display{font-family:var(--display);font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.95}
.label{font-family:var(--display);font-stretch:112%;font-weight:600;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

/* Héro */
.hero{padding-block:22px 6px;position:relative}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand .label{color:var(--fg)}
.hero h1{font-size:clamp(2.5rem,13vw,4.2rem);margin:14px 0 0}
.hero h1 span{display:block;color:transparent;-webkit-text-stroke:1.2px var(--fg)}
.hero-car{margin:4px -16px 0;position:relative}
.hero-car svg{display:block;width:100%;height:auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpis div{padding:12px 4px 12px 0}
.kpis div+div{border-left:1px solid var(--line);padding-left:12px}
.kpis b{display:block;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:1.7rem;line-height:1}
.mini{padding-block:22px 4px}
.mini h1{font-size:clamp(2rem,10vw,3rem);margin:12px 0 0}

h2{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:1.25rem;text-transform:uppercase;letter-spacing:.01em;margin:26px 0 12px;text-wrap:balance}

/* Filtres */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:.88rem;white-space:nowrap;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{opacity:.6;margin-left:4px}

/* Cartes mission */
.list{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.mcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;color:var(--fg)}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px 0}
.mcar{padding:4px 14px 0;display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px}
.mcar svg{width:100%;max-width:230px;height:auto;display:block}
.mcar .model{text-align:right;min-width:0}
.mcar .model b{display:block;font-family:var(--display);font-stretch:118%;font-weight:700;font-size:1rem;text-transform:uppercase;line-height:1.1}
.mroute{display:grid;grid-template-columns:14px 1fr;gap:2px 10px;padding:12px 14px;border-top:1px solid var(--line);margin-top:10px;font-size:.95rem}
.mroute i{width:9px;height:9px;border:2px solid var(--fg);border-radius:50%;margin-top:6px}
.mroute i.b{background:var(--fg)}
.mroute span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--surface2)}
.mfoot .client{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price{font-family:var(--display);font-stretch:118%;font-weight:800;font-size:1.15rem;white-space:nowrap}

/* Plaque */
.plate{display:inline-flex;align-items:stretch;border:1.5px solid var(--plate-ink);outline:1px solid var(--line);border-radius:4px;background:var(--plate-bg);color:var(--plate-ink);font-family:var(--mono);font-weight:600;letter-spacing:.04em;font-size:.82rem;line-height:1;overflow:hidden;white-space:nowrap}
.plate i{font-style:normal;background:var(--plate-ink);color:var(--plate-bg);font-size:.55rem;padding:3px 3px;display:flex;align-items:flex-end;font-family:var(--body);font-weight:700}
.plate span{padding:4px 7px}
.plate.big{font-size:1.25rem}
.plate.big i{font-size:.7rem;padding:4px 5px}
.plate.big span{padding:7px 14px}

/* Statuts en noir et blanc */
.pill{font-family:var(--display);font-stretch:112%;font-weight:700;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;border-radius:999px;padding:4px 9px;white-space:nowrap;border:1px solid var(--fg)}
.st-a_faire{color:var(--fg);background:transparent;border-style:dashed}
.st-en_cours{color:var(--fg);background:repeating-linear-gradient(-45deg,var(--surface2) 0 4px,transparent 4px 8px)}
.st-livree{background:var(--fg);color:var(--bg)}
.st-payee{background:var(--fg);color:var(--bg)}
.st-payee::before{content:"✓ "}
.when{font-family:var(--mono);font-size:.82rem;color:var(--muted)}

/* Vide */
.empty{border:1px dashed var(--line);border-radius:16px;padding:22px 18px 24px;text-align:center;color:var(--muted);margin-top:14px}
.empty svg{width:62%;max-width:220px;height:auto;opacity:.35;display:block;margin:0 auto 10px}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-stretch:118%;font-size:1.05rem;text-transform:uppercase;margin-bottom:4px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:12px;padding:12px 16px;font-weight:700;text-decoration:none;color:var(--fg);font-size:.95rem}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:auto;top:calc(var(--appH,100vh) - 80px - env(safe-area-inset-bottom,0px) * .2);transform:translateY(-100%);background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:15px 20px;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 8px 28px rgba(0,0,0,.6);z-index:5}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:auto;top:var(--appH,100vh);transform:translateY(-100%);background:rgba(10,10,10,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:calc(env(safe-area-inset-bottom,0px) * .2 + 2px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:6}
.tab{background:none;border:0;padding:10px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--fg)}

/* Détail */
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px}
.back{background:none;border:0;font-weight:700;color:var(--fg);padding:6px 0;font-size:.95rem}
.dhero{text-align:center;padding-block:4px 6px}
.dhero h1{font-size:clamp(1.8rem,9vw,2.6rem);margin:6px 0 2px;overflow-wrap:anywhere}
.dhero .car{margin:4px auto 0;max-width:420px}
.dhero .car svg{width:100%;height:auto;display:block}
.dhero .meta{margin-top:8px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.panel > .label{display:block;margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.95rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step{border:0;background:transparent;padding:11px 2px;font-family:var(--display);font-stretch:112%;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.68rem;color:var(--dim)}
.step+.step{border-left:1px solid var(--line)}
.step.done{background:var(--fg);color:var(--bg)}

/* Trajet */
.route{display:block;border-radius:16px;overflow:hidden;border:1px solid var(--line);text-decoration:none;color:var(--fg);background:var(--surface)}
.route svg{display:block;width:100%;height:auto}
.route .cta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;font-weight:700;border-top:1px solid var(--line)}
.route .cta span:last-child{font-family:var(--display);font-stretch:112%;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;background:var(--fg);color:var(--bg);padding:6px 10px;border-radius:999px}

/* PV */
.pvsum{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:4px 0 14px;border:1px solid var(--line);border-radius:12px}
.pvsum div{padding:10px}
.pvsum div+div{border-left:1px solid var(--line)}
.pvsum b{display:block;font-family:var(--display);font-stretch:118%;font-weight:800;font-size:1.1rem}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;aspect-ratio:4/3;max-width:100%;border:1px dashed var(--dim);border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;text-align:center;font-size:.78rem;color:var(--muted);overflow:hidden;padding:4px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.slot .lbl{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);color:#fff;font-size:.68rem;padding:3px 4px;font-weight:600}
.slot.filled{border-style:solid;border-color:var(--line)}
.gauge{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.gauge button{border:1px solid var(--line);background:var(--surface2);border-radius:4px;height:34px;font-size:.66rem;font-weight:700;color:var(--muted);padding:0}
.gauge button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.sigbox{border:1px solid var(--line);border-radius:12px;background:#fff;touch-action:none;width:100%;height:170px;display:block}
.sigimg{background:#fff;border-radius:10px;max-height:110px;display:block}

/* Formulaires */
form{display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.88rem}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;font-size:16px;width:100%;min-width:0;color:var(--fg)}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,select:focus,textarea:focus{border-color:var(--fg);outline:none}
textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--danger);font-size:.9rem;font-weight:600}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cat svg{width:100%;height:auto;max-width:96px}
.cat[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);background:var(--surface2)}
.formhead{padding-block:4px 6px}
.formhead h1{font-size:clamp(1.7rem,8vw,2.4rem);margin:4px 0 0}

/* Bilan */
.big{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:16px;margin-top:14px}
.big b{display:block;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(2.4rem,12vw,3.6rem);line-height:1}
.stats{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.stat{padding:14px 0}
.stat:nth-child(even){border-left:1px solid var(--line);padding-left:14px}
.stat:nth-child(n+3){border-top:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-stretch:118%;font-weight:800;font-size:1.45rem;line-height:1.1;margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
.tbl th{font-family:var(--display);font-stretch:112%;text-transform:uppercase;letter-spacing:.12em;font-size:.66rem;color:var(--muted);font-weight:700}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px}
.monthnav b{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:1.2rem;text-transform:uppercase}

/* Frais */
.frow{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;text-align:left;width:100%;color:var(--fg)}
.ficon{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;color:var(--fg);font-size:.72rem}
.frow > div{min-width:0}
.frow .t{font-weight:700}
.frow .s{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.banner{border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:.9rem;margin-top:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translate(-50%,-100%);bottom:auto;top:calc(var(--appH,100vh) - 92px - env(safe-area-inset-bottom,0px) * .2);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
.confirm{border:1px solid var(--danger);border-radius:12px;padding:14px;margin-top:10px;display:flex;flex-direction:column;gap:10px}
/* Version native iPhone : typographie système, vraies photos */
*{font-stretch:normal!important}
.display{text-transform:none;letter-spacing:-.025em;font-weight:800;line-height:1.08}
.label{letter-spacing:.07em;font-size:.68rem}
.hero{padding-block:16px 2px}
.hero h1,.mini h1{font-size:2.05rem;margin:2px 0 0}
.mini{padding-block:16px 2px}
.today{color:var(--muted);font-size:.92rem;font-weight:600}
.today::first-letter{text-transform:uppercase}
h2{text-transform:none;font-size:1.3rem;letter-spacing:-.015em;font-weight:700;margin:24px 0 10px}
.kpis{margin-top:16px}
.kpis b{font-size:1.55rem;font-weight:800;letter-spacing:-.02em}
.cover{position:relative;border-radius:18px;overflow:hidden;margin-top:14px;aspect-ratio:16/9;max-width:100%;background:var(--surface)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.7))}
.mphoto{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--surface2);overflow:hidden}
.mphoto img{width:100%;height:100%;object-fit:cover;display:block}
.mphoto.noimg{aspect-ratio:auto;height:64px}
.mphoto .st{position:absolute;top:10px;right:10px}
.mphoto .tag{position:absolute;top:10px;left:10px}
.mphoto.noimg .st,.mphoto.noimg .tag{top:50%;transform:translateY(-50%)}
.mphoto .pill.st-a_faire,.mphoto .pill.st-en_cours{background-color:rgba(10,10,10,.65);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px 0}
.mhead b{font-size:1.08rem;font-weight:700;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msub{padding:2px 14px 0;font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price{font-weight:700;letter-spacing:-.01em}
.pill{letter-spacing:.06em;font-size:.66rem}
.dphoto{border-radius:18px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--surface);margin-bottom:14px}
.dphoto img{width:100%;height:100%;object-fit:cover;display:block}
.dhero{text-align:left}
.dhero h1{font-size:1.9rem;margin:4px 0 0}
.dhero .meta{justify-content:flex-start}
.formhead h1{font-size:2rem}
.slot img{filter:none}
.fab{text-transform:none;letter-spacing:0;font-size:1rem;font-weight:700;padding:14px 20px}
.tab{text-transform:none;letter-spacing:0;font-size:.7rem;font-weight:600}
.step{letter-spacing:.03em;font-size:.68rem}
.monthnav b{text-transform:none;font-size:1.15rem;letter-spacing:-.01em}
.monthnav b::first-letter{text-transform:uppercase}
.big b{font-size:2.6rem;letter-spacing:-.03em}
.stat b{letter-spacing:-.02em}
.tbl th{letter-spacing:.06em}
.route .cta span:last-child{letter-spacing:.04em}
.coverpick{width:100%;aspect-ratio:16/9}
/* Héro Veylor Drive : photo plein écran, fumée animée, logotype étiré */
.brandfont{font-family:"Syncopate","Arial Black",Arial,sans-serif;font-weight:700;text-transform:uppercase}
.shero{position:relative;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));height:clamp(330px,92vw,460px);overflow:hidden;background:#000;isolation:isolate}
.shero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:58% 50%;transform-origin:70% 50%;z-index:0;opacity:0;transition:opacity .9s ease}
.shero img.on{opacity:1}
.dots{display:flex;gap:6px;margin-top:14px}.dots i{width:18px;height:2px;background:rgba(255,255,255,.3);transition:background .6s,width .6s}.dots i.on{background:#fff;width:30px}
.shero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.shero .fade{position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,0) 70%),linear-gradient(180deg,rgba(10,10,10,0) 55%,var(--bg) 100%)}
.shero .txt{position:absolute;z-index:3;left:max(18px,env(safe-area-inset-left,0px));right:max(18px,env(safe-area-inset-right,0px));bottom:34px;color:#fff}
.shero .wm{font-family:"Syncopate","Arial Black",Arial,sans-serif;font-weight:700;font-size:clamp(1.55rem,8.4vw,2.4rem);letter-spacing:.32em;line-height:1;margin:0;text-transform:uppercase;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.shero .sub{font-family:"Syncopate","Arial Black",Arial,sans-serif;font-weight:400;font-size:.72rem;letter-spacing:.55em;text-transform:uppercase;margin-top:12px;opacity:.9}
.shero .line{width:46px;height:2px;background:#fff;margin:16px 0 12px}
.shero .date{font-size:.85rem;color:rgba(255,255,255,.7);font-weight:600}
.shero .date::first-letter{text-transform:uppercase}
.mini h1{font-family:"Syncopate","Arial Black",Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.22em;font-size:clamp(1.25rem,6.4vw,1.7rem);margin-top:8px}
.mini .today{font-family:"Syncopate","Arial Black",Arial,sans-serif;font-size:.62rem;letter-spacing:.4em;text-transform:uppercase}
h2{font-family:"Syncopate","Arial Black",Arial,sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;margin:26px 0 12px}
.sectitle{font-family:"Syncopate","Arial Black",Arial,sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;margin:24px 0 12px}
@media (prefers-reduced-motion: no-preference){
 .shero img.on{animation:kb 4s ease-out both}
 @keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}
 .shero .txt>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
 .shero .txt>*:nth-child(2){animation-delay:.15s}.shero .txt>*:nth-child(3){animation-delay:.3s}.shero .txt>*:nth-child(4){animation-delay:.45s}
 @keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
}
.plate i{align-self:stretch;height:auto;justify-content:center}
@media (prefers-reduced-motion: no-preference){
  .mcard,.btn,.chip,.cat{transition:transform .12s}.mcard:active,.btn:active,.cat:active{transform:scale(.985)}
}
</style>
</head>

/* ---------- Données ---------- */
async function init(){
  if(!FB_OK||!window.firebase){S.authReady=true;render();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.firestore();
  try{await Promise.race([db.enablePersistence({synchronizeTabs:true}).catch(()=>{}),new Promise(r=>setTimeout(r,2000))])}catch(e){}
  S.db=db;S.assets={upload:async b=>({id:await putPhoto(b)})};S.downloads={};
  let unsubs=[];
  setTimeout(()=>{if(!S.authReady){S.slow=true;render()}},12000);
  firebase.auth().onAuthStateChanged(u=>{
    S.user=u;S.authReady=true;unsubs.forEach(f=>f());unsubs=[];S.loaded={m:false,f:false};
    if(u){
      unsubs.push(db.collection('missions').onSnapshot(s=>{S.missions=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.m=true;update()},e=>{toast('Missions indisponibles : '+e.message)}));
      unsubs.push(db.collection('clients').onSnapshot(s=>{S.clients=s.docs.map(d=>({id:d.id,...d.data()}));update()},()=>{}));
      unsubs.push(db.collection('frais').onSnapshot(s=>{S.frais=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.f=true;update()},()=>{}));
      unsubs.push(db.doc('config/equipe').onSnapshot(s=>{if(s.exists){const c=s.data()||{};S.config={convoyeurs:(c.convoyeurs&&c.convoyeurs.length)?c.convoyeurs:['Rafael'],societe:c.societe||'',tel:c.tel||'',tel2:c.tel2||'',cover:c.cover||null,tarifKm:c.tarifKm||'',prixMin:c.prixMin||''}}update()},()=>{}));
    }else{S.missions=[];S.frais=[]}
    S.view=null;S.draft=null;render();
  });
}

function routeSVG(m){
  const seed=[...(m.depart||'')+(m.arrivee||'')].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
  const r=n=>((seed>>>(n*3))%100)/100;
  const ax=46,ay=122,bx=294,by=46;
  const c1x=110+r(1)*60,c1y=40+r(2)*50,c2x=200+r(3)*50,c2y=110+r(4)*40;
  const roads=[0,1,2,3,4].map(i=>{const y=20+i*36+r(i+5)*14;return `<path d="M-10 ${y} C 90 ${y+30*(r(i)-.5)}, 220 ${y-26*(r(i+2)-.5)}, 350 ${y+10}" stroke="var(--line)" stroke-width="${i%2?4:2}" fill="none"/>`}).join('')+[0,1,2].map(i=>{const x=60+i*110+r(i+8)*30;return `<path d="M${x} -10 C ${x+20} 60, ${x-30} 100, ${x+10} 170" stroke="var(--line)" stroke-width="2" fill="none"/>`}).join('');
  const route=`M${ax} ${ay} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${bx} ${by}`;
  const t=(x,y,anchor,txt,sub)=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="Archivo, Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="1" fill="var(--fg)">${esc(txt).toUpperCase().slice(0,20)}</text><text x="${x}" y="${y+13}" text-anchor="${anchor}" font-family="IBM Plex Mono, monospace" font-size="9" fill="var(--muted)">${sub}</text>`;
  return `<svg viewBox="0 0 340 170" role="img" aria-label="Aperçu du trajet de ${esc(ville(m.depart))} à ${esc(ville(m.arrivee))}">
   <rect width="340" height="170" fill="var(--surface)"/>${roads}
   <path d="${route}" stroke="var(--fg)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="0.1 9"/>
   <path d="${route}" stroke="var(--fg)" stroke-width="2" fill="none" stroke-linecap="round"/>
   <circle cx="${ax}" cy="${ay}" r="8" fill="var(--surface)" stroke="var(--fg)" stroke-width="3"/>
   <circle cx="${bx}" cy="${by}" r="10" fill="var(--fg)"/><circle cx="${bx}" cy="${by}" r="3.5" fill="var(--surface)"/>
   ${t(ax-8,ay+26>160?ay-20:ay+24,'start',ville(m.depart),'DÉPART')}
   ${t(bx-16,by-22,'end',ville(m.arrivee),'ARRIVÉE')}
  </svg>`;
}

let sigDirty=false;
function setupSignature(){
  const c=$('#sig');if(!c)return;sigDirty=false;
  const dpr=window.devicePixelRatio||1;const r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=r.height*dpr;
  const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
  let drawing=false;
  const pos=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke();sigDirty=true});
  c.addEventListener('pointermove',e=>{if(!drawing)return;const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()});
  const end=()=>{drawing=false};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}

function bilanData(mois){
  const ms=S.missions.filter(m=>(m.date||'').startsWith(mois)&&(m.statut==='livree'||m.statut==='payee'));
  const fs=S.frais.filter(f=>(f.date||'').startsWith(mois));
  const par={};S.config.convoyeurs.forEach(n=>par[n]={n:0,ca:0,frais:0,km:0});
  const P=n=>par[n||'—']||(par[n||'—']={n:0,ca:0,frais:0,km:0});
  let ca=0,aEnc=0,km=0;
  ms.forEach(m=>{const p=num(m.prix);ca+=p;if(m.statut==='livree')aEnc+=p;const x=P(m.convoyeur);x.n++;x.ca+=p;
    if(m.pvDepart&&m.pvArrivee&&m.pvDepart.km&&m.pvArrivee.km){const k=num(m.pvArrivee.km)-num(m.pvDepart.km);if(k>0){km+=k;x.km+=k}}});
  let frais=0;fs.forEach(f=>{const v=num(f.montant);frais+=v;P(f.convoyeur).frais+=v});
  return {ms,fs,ca,frais,net:ca-frais,aEnc,km,par};
}

/* ---------- Fumée ---------- */
let smokeRAF=0,puffs=null;
function makePuff(n,rmin,rmax,alpha){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  for(let i=0;i<n;i++){const ang=Math.random()*6.28,dist=Math.random()*70,px=128+Math.cos(ang)*dist,py=128+Math.sin(ang)*dist*.6,r=rmin+Math.random()*(rmax-rmin);
    const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,'rgba(230,230,230,'+alpha+')');g.addColorStop(.6,'rgba(230,230,230,'+(alpha*.35)+')');g.addColorStop(1,'rgba(230,230,230,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill()}
  return c}
function startSmoke(){
  cancelAnimationFrame(smokeRAF);const c=document.getElementById('smoke');if(!c)return;
  if(!puffs)puffs=[makePuff(26,14,46,.13),makePuff(18,24,60,.11),makePuff(40,8,26,.14)];
  const dpr=Math.min(2,window.devicePixelRatio||1);const W=c.clientWidth,H=c.clientHeight;if(!W||!H)return;c.width=W*dpr;c.height=H*dpr;
  const x=c.getContext('2d');x.scale(dpr,dpr);
  const N=Math.round(34+W/12);
  const spawn=(init)=>{const fog=Math.random()<.25;return {
    x:fog?W*(Math.random()*1.2):W*(.5+Math.random()*.6), y:fog?H*(.8+Math.random()*.25):(init?H*(.2+Math.random()*.7):H*(.45+Math.random()*.45)),
    s:fog?220+Math.random()*200:60+Math.random()*120, sp:puffs[(Math.random()*puffs.length)|0],
    max:fog?.35:.45+Math.random()*.4, vx:-(.06+Math.random()*.15)*(fog?.5:1), vy:fog?-(.005+Math.random()*.015):-(.025+Math.random()*.08),
    r:Math.random()*6.28, vr:(Math.random()-.5)*.002, g:fog?.03:.06+Math.random()*.1,
    f:.004+Math.random()*.01, ph:Math.random()*6.28, amp:.05+Math.random()*.12, life:0, ttl:(fog?2400:1300)+Math.random()*1500, sx:1.3+Math.random()*.9}};
  const P=[];for(let i=0;i<N;i++){const p=spawn(true);p.life=Math.random()*p.ttl;P.push(p)}
  const still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last=performance.now();
  const frame=(now)=>{
    if(!document.body.contains(c))return;
    const dt=Math.min(3,((now||last)-last)/16.67)||1;last=now||last;
    x.clearRect(0,0,W,H);
    for(const p of P){
      if(!still){p.life+=dt;
        p.x+=(p.vx+Math.sin(p.life*p.f+p.ph)*p.amp)*dt;
        p.y+=(p.vy+Math.cos(p.life*p.f*.7+p.ph)*p.amp*.45)*dt;
        p.r+=p.vr*dt;p.s+=p.g*dt}
      const t=p.life/p.ttl;const fade=t<.18?t/.18:t>.65?Math.max(0,(1-t)/.35):1;
      x.globalAlpha=Math.min(1,p.max*fade*.4);x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(p.sx,1);x.drawImage(p.sp,-p.s/2,-p.s/2,p.s,p.s);x.restore();
      if(p.life>=p.ttl||p.x<-p.s||p.y<-p.s)Object.assign(p,spawn(false));
    }
    x.globalAlpha=1;
    if(!still)smokeRAF=requestAnimationFrame(frame);
  };frame();
}

/* ---------- Conflits de planning ---------- */
function chevauche(a,b){
  if(a.convoyeur!==b.convoyeur||!a.date||a.date!==b.date)return false;
  const sa=minutesOf(a.heure),sb=minutesOf(b.heure);
  if(sa==null||sb==null)return true;
  const ea=sa+(num(a.dureeMin)||120),eb=sb+(num(b.dureeMin)||120);
  return sa<eb&&sb<ea;
}
function conflitsPour(m){return S.missions.filter(x=>x.id!==m.id&&x.statut!=='payee'&&chevauche(m,x))}

/* ---------- Calcul du trajet et du prix ---------- */
function prixConseille(km){const t=num(S.config.tarifKm),mn=num(S.config.prixMin);if(!t)return null;let p=Math.max(km*t,mn);return Math.ceil(p/5)*5}
function calcHTML(){
  const r=S.draft&&S.draft.route;
  if(!r)return '<span class="muted">Choisis les deux adresses pour calculer la distance et le prix conseillé.</span>';
  if(r.status==='loading')return '<span class="muted">Calcul du trajet…</span>';
  if(r.status==='err')return `<span class="muted">Trajet introuvable pour ces adresses.</span> <button type="button" class="linkbtn" data-act="calcRoute">Réessayer</button>`;
  const p=prixConseille(r.km);
  return `<div class="calcrow"><div><span class="label">Trajet</span><b class="num">${esc(fmtKm(r.km))} · ${esc(fmtDuree(r.min))}</b></div>${p!=null?`<div><span class="label">Prix conseillé</span><b class="num">${p} €</b></div><button type="button" class="btn small" data-act="applyPrice" data-v="${p}">Appliquer</button>`:''}</div>${p==null?'<div class="muted" style="font-size:.82rem;margin-top:6px">Indique ton prix au km dans Équipe pour avoir un prix conseillé.</div>':''}`;
}
let routeT=null,routeSeq=0;
function scheduleRoute(ms){clearTimeout(routeT);routeT=setTimeout(computeRoute,ms==null?400:ms)}
async function geocode(q){const r=await fetch('https://data.geopf.fr/geocodage/search?limit=1&q='+encodeURIComponent(q));const j=await r.json();const f=(j.features||[])[0];return f?f.geometry.coordinates:null}
async function computeRoute(){
  const d=S.draft;const a=$('#m_depart'),b=$('#m_arrivee'),box=$('#calc');if(!d||!a||!b||!box)return;
  const from=a.value.trim(),to=b.value.trim();
  if(from.length<5||to.length<5){d.route=null;box.innerHTML=calcHTML();return}
  if(d.route&&d.route.status==='ok'&&d.route.from===from&&d.route.to===to){box.innerHTML=calcHTML();return}
  const my=++routeSeq;d.route={status:'loading'};box.innerHTML=calcHTML();
  try{
    const ca=(d.coords.m_depart&&d.coords.m_depart.label===from)?d.coords.m_depart.c:await geocode(from);
    const cb=(d.coords.m_arrivee&&d.coords.m_arrivee.label===to)?d.coords.m_arrivee.c:await geocode(to);
    if(!ca||!cb)throw 0;
    const r=await fetch(`https://data.geopf.fr/navigation/itineraire?resource=bdtopo-osrm&profile=car&optimization=fastest&distanceUnit=kilometer&timeUnit=minute&getSteps=false&start=${ca[0]},${ca[1]}&end=${cb[0]},${cb[1]}`);
    const j=await r.json();if(!(j.distance>0))throw 0;
    if(my!==routeSeq||S.draft!==d)return;
    d.route={status:'ok',km:Math.round(j.distance),min:Math.round(j.duration),from,to};
  }catch(e){if(my!==routeSeq||S.draft!==d)return;d.route={status:'err'}}
  const bx=$('#calc');if(bx)bx.innerHTML=calcHTML();
}

/* ---------- GPS et horodatage des photos ---------- */
let geoP=null;
function getGeo(){return new Promise(res=>{if(!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy)}),()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:30000})})}
async function lieuDe(g){if(!g)return '';try{const j=await Promise.race([fetch(`https://data.geopf.fr/geocodage/reverse?lon=${g.lon}&lat=${g.lat}&limit=1`).then(r=>r.json()),new Promise((_,rj)=>setTimeout(()=>rj(0),5000))]);
  const p=((j.features||[])[0]||{}).properties||{};return p.label||[p.postcode,p.city].filter(Boolean).join(' ')||''}catch(e){return ''}}
async function stampPhoto(b,meta){
  const url=URL.createObjectURL(b);
  try{const img=await loadImg(url);const w=img.naturalWidth,h=img.naturalHeight;const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0);
    const fs=Math.max(14,Math.round(w*0.026));const pad=Math.round(fs*0.6);const lines=[];

async function compress(file,max=1280,q=.62){

    if(S.view.phase==='pvArrivee'&&m.statut!=='payee')upd.statut='livree';
    await S.db.doc('missions/'+S.view.id).update(upd);S.draft=null;toast('État des lieux enregistré');go({type:'mission',id:S.view.id});
  }else if(f.id==='fFrais'){
    const d=S.draft;if(Object.keys(d.uploading).length){showErr('Attends la fin de l\'envoi du ticket.');return}
    const data={type:d.type,montant:val('f_montant').replace(',','.'),date:val('f_date'),convoyeur:val('f_convoyeur'),missionId:val('f_mission'),note:val('f_note'),photo:d.photo||null};
    if(!(num(data.montant)>0)){showErr('Indique un montant supérieur à 0.');return}
    if(S.view.id)await S.db.doc('frais/'+S.view.id).update(data);else await S.db.collection('frais').add({...data,creeLe:Date.now()});
    const back=S.view.back||null;
    S.draft=null;fraisInputs=null;toast('Frais enregistré');back?go(back):(S.view=null,render());
  }else if(f.id==='fClient'){
    const data={nom:val('c_nom'),tel:val('c_ctel'),email:val('c_email'),adresse:val('c_adresse'),notes:val('c_notes')};
    if(!data.nom){showErr('Indique le nom du client.');return}
    let cid=S.view.id;
    if(cid)await S.db.doc('clients/'+cid).update(data);else{const ref=await S.db.collection('clients').add({...data,cree:Date.now()});cid=ref.id}
    toast('Client enregistré');go({type:'client',id:cid});
  }else if(f.id==='fConfig'){
    const conv=[0,1,2,3].map(i=>val('c_conv'+i)).filter(Boolean);
    if(!conv.length){showErr('Indique au moins un convoyeur.');return}
    if(S.draft&&S.draft.uploading&&Object.keys(S.draft.uploading).length){showErr('Attends la fin de l\'envoi de la photo.');return}
    await S.db.doc('config/equipe').set({convoyeurs:conv,societe:val('c_societe'),tel:val('c_tel'),tel2:val('c_tel2'),tarifKm:val('c_tarifKm').replace(',','.'),prixMin:val('c_prixMin').replace(',','.'),cover:null});formInputs=null;toast('Équipe enregistrée');
  }
  }catch(err){showErr('Enregistrement impossible : '+(err&&err.code==='not_granted'?'tu n\'as pas le droit de modifier cette appli.':(err&&err.message)||'réessaie.'))}
  finally{if(btn&&document.body.contains(btn))btn.disabled=false}
});

render();init();
})();
</script>
</body>
</html>
